version: 2
updates:
  # Dépendances Python (requirements.txt, requirements-flet.txt à la racine).
  # Répond directement au résidu « chaîne d'approvisionnement non épinglée »
  # de l'audit : les versions sont figées, Dependabot propose les montées.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    ignore:
      # Les versions mineures de Flet cassent régulièrement l'API (0.80, 0.85,
      # 1.0…) : on n'accepte que les patchs automatiques (1.0.x), une montée
      # mineure/majeure se fait à la main avec rendu visuel (cf. CLAUDE.md).
      - dependency-name: flet
        update-types:
          - version-update:semver-minor
          - version-update:semver-major

  # Versions des actions GitHub (checkout, setup-python, upload-artifact…).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
